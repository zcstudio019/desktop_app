name: Agent Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/services/agents/**"
      - "backend/services/ai_service.py"
      - "scripts/test_agent_regression.py"
      - "tests/fixtures/agent_cases/**"
      - "tests/snapshots/agent_cases/**"
      - "package.json"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  agent-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, skipping Python dependency install"
          fi

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "package.json not found, skipping npm install"
          fi

      - name: Python compile check
        run: python -m compileall backend scripts tests

      - name: Frontend build
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "package.json not found, skipping frontend build"
          fi

      - name: Agent regression with drift guard
        env:
          ENABLE_FINANCING_AGENT: "true"
          ENABLE_AGENT_LLM: "false"
          AGENT_DEBUG: "false"
        run: python scripts/test_agent_regression.py --report --html-report --metrics --fail-on-drift

      - name: Comment PR with Agent regression summary
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agent-regression-report -->';
            const summaryPath = 'reports/agent_regression/pr_summary.md';
            let body = `${marker}\n\nAgent regression report was not generated. Check the workflow logs for details.`;

            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              body = summary.includes(marker) ? summary : `${marker}\n\n${summary}`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.body &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload Agent reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-regression-reports
          path: |
            reports/agent_regression/
            reports/agent_metrics/
            data/agent_runs/
